<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>阴山文化 · 数字地图 & 3D地形</title>
    <style>
        :root {
            --ink: #080b0c; --gold: #c9a96e; --gold-bright: #e7c98d;
            --sand: #f7f0df; --muted: #b7aa93;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: "Microsoft YaHei","PingFang SC",sans-serif;
            background: var(--ink); color: var(--sand); overflow: hidden;
        }
        /* ---- 顶部导航 ---- */
        .top-bar {
            position: absolute; top:0; left:0; right:0; z-index:100;
            background: rgba(7,10,11,0.92);
            border-bottom: 1px solid rgba(201,169,110,0.18);
            backdrop-filter: blur(20px);
        }
        .top-bar::after {
            content:""; position:absolute; bottom:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), transparent);
        }
        .top-bar .inner {
            max-width:1440px; margin:0 auto; padding:0 28px;
            display:flex; align-items:center; height:56px; justify-content:space-between;
        }
        .brand {
            font-family:"STKaiti","KaiTi",Georgia,serif; font-size:1.15rem; font-weight:700;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            -webkit-background-clip:text; background-clip:text; color:transparent;
            text-decoration:none; letter-spacing:4px;
        }
        .top-nav { display:flex; gap:4px; list-style:none; }
        .top-nav a {
            display:inline-flex; align-items:center; height:36px; padding:0 12px;
            color: rgba(247,240,223,0.65); text-decoration:none;
            font-family:"STKaiti","KaiTi",Georgia,serif; font-size:0.85rem;
            letter-spacing:2px; border-radius:6px; transition: color 0.3s, background 0.3s;
        }
        .top-nav a:hover, .top-nav a.active { color: var(--gold-bright); background: rgba(201,169,110,0.06); }
        /* ---- 视图容器 ---- */
        .view-container { position:absolute; inset:58px 0 0 0; overflow:hidden; }
        .view-panel { position:absolute; inset:0; display:none; }
        .view-panel.is-active { display:block; }
        /* ---- 地图 ---- */
        .map-view { position:absolute; inset:0; }
        #amapContainer { width:100%; height:100%; }
        .map-search {
            position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:10;
            display:flex; border:1px solid rgba(201,169,110,0.3); border-radius:30px;
            overflow:hidden; background: rgba(10,14,15,0.92);
            backdrop-filter: blur(12px); box-shadow:0 8px 30px rgba(0,0,0,0.4);
        }
        .map-search input { padding:10px 18px; border:none; outline:none; width:260px; background:transparent; color:var(--sand); font-size:0.9rem; }
        .map-search input::placeholder { color: var(--muted); }
        .map-search button { background:linear-gradient(135deg,var(--gold-bright),var(--gold)); border:none; padding:10px 20px; color:#16110a; cursor:pointer; font-weight:600; font-size:0.85rem; }
        .map-search button:hover { filter:brightness(1.1); }
        .map-hint { position:absolute; top:80px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:0.8rem; background:rgba(10,14,15,0.8); padding:6px 16px; border-radius:20px; z-index:10; pointer-events:none; }
        /* ---- 视图切换 ---- */
        .view-toggle {
            position:absolute; right:20px; top:76px; z-index:200;
            display:flex; gap:0; background:rgba(10,14,15,0.88);
            border:1px solid rgba(201,169,110,0.25); border-radius:30px;
            overflow:hidden; backdrop-filter:blur(12px); box-shadow:0 8px 30px rgba(0,0,0,0.4);
        }
        .view-toggle button {
            padding:8px 18px; border:none; cursor:pointer; background:transparent;
            color:rgba(247,240,223,0.6); font-family:"STKaiti","KaiTi",Georgia,serif;
            font-size:0.85rem; letter-spacing:1px; transition:all 0.3s; white-space:nowrap;
        }
        .view-toggle button.is-active { background:linear-gradient(135deg,var(--gold-bright),var(--gold)); color:#16110a; font-weight:700; }
        .view-toggle button:hover:not(.is-active) { color:var(--gold-bright); }
        /* ---- 地形控制 ---- */
        .terrain-panel { position:absolute; right:20px; bottom:20px; }
        .terrain-hud { background:rgba(10,14,15,0.92); backdrop-filter:blur(16px); border-radius:12px; padding:14px 16px; font-size:13px; border:1px solid rgba(201,169,110,0.22); box-shadow:0 12px 36px rgba(0,0,0,0.4); z-index:200; }
        .terrain-panel .ptitle { font-weight:700; font-family:"STKaiti","KaiTi",Georgia,serif; letter-spacing:2px; color:var(--gold-bright); border-bottom:1px solid rgba(201,169,110,0.2); padding-bottom:8px; margin-bottom:10px; text-align:center; font-size:15px; }
        .terrain-panel button { background:linear-gradient(135deg,var(--gold-bright),var(--gold)); border:none; color:#16110a; padding:7px 14px; margin:4px 0; border-radius:20px; cursor:pointer; width:100%; font-weight:600; font-size:13px; transition:filter 0.2s; }
        .terrain-panel button:hover { filter:brightness(1.1); }
        .terrain-panel input[type=range] { width:100%; cursor:pointer; accent-color:var(--gold-bright); margin-top:4px; }
        .terrain-panel label { color:var(--muted); font-size:12px; }
        .compass { position:absolute; right:20px; top:130px; z-index:200; width:52px; height:52px; border-radius:50%; background:rgba(10,14,15,0.85); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; pointer-events:none; border:1px solid rgba(201,169,110,0.3); }
        .compass .compass-arrow {
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 18px solid var(--gold-bright);
            position: absolute; top: 8px;
        }
        .compass .compass-south {
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 12px solid rgba(201,169,110,0.35);
            position: absolute; bottom: 8px;
        }
        .compass .compass-label {
            position: absolute; font-size: 10px; font-weight: 700;
            font-family: Georgia, serif; letter-spacing: 0;
        }
        .compass .compass-n { top: 2px; color: var(--gold-bright); }
        .compass .compass-s { bottom: 2px; color: rgba(201,169,110,0.45); }
        .compass .compass-e { right: 6px; color: rgba(201,169,110,0.45); }
        .compass .compass-w { left: 6px; color: rgba(201,169,110,0.45); }
        @keyframes compassGlow {
            0%, 100% { box-shadow: 0 0 12px rgba(201,169,110,0.1); }
            50% { box-shadow: 0 0 18px rgba(201,169,110,0.18); }
        }
        /* ---- 弹窗 ---- */
        .modal { display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.75); justify-content:center; align-items:center; backdrop-filter:blur(6px); }
        .modal-content { background:rgba(14,18,20,0.97); border:1px solid rgba(201,169,110,0.22); border-radius:12px; max-width:480px; width:90%; padding:24px; box-shadow:0 24px 60px rgba(0,0,0,0.5); color:var(--sand); animation:modalIn 0.3s ease; }
        .modal-content h3 { color:var(--gold-bright); font-family:"STKaiti","KaiTi",Georgia,serif; font-size:1.25rem; margin:0 0 10px; letter-spacing:2px; border-bottom:1px solid rgba(201,169,110,0.25); padding-bottom:8px; }
        .modal-content img { width:100%; border-radius:8px; margin:12px 0; border:1px solid rgba(201,169,110,0.2); }
        .modal-content p { color:var(--muted); line-height:1.7; font-size:14px; }
        .modal-content button { background:linear-gradient(135deg,var(--gold-bright),var(--gold)); color:#16110a; border:none; padding:10px 22px; border-radius:30px; cursor:pointer; font-size:14px; font-weight:600; margin-top:14px; width:100%; transition:filter 0.2s; }
        .modal-content button:hover { filter:brightness(1.1); }
        .close-btn { float:right; font-size:24px; font-weight:bold; cursor:pointer; color:var(--muted); line-height:1; }
        .close-btn:hover { color:var(--gold-bright); }
        @keyframes modalIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .panorama-container { display:none; position:fixed; inset:0; z-index:1100; background:#000; }
        .close-panorama { position:absolute; top:20px; right:20px; z-index:1110; font-size:36px; color:#fff; cursor:pointer; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); border-radius:50%; width:48px; height:48px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(201,169,110,0.3); }
        .close-panorama:hover { border-color:var(--gold-bright); }
        @media (max-width:700px) {
            .top-nav a { font-size:0.7rem; padding:0 6px; letter-spacing:1px; }
            .top-bar .inner { padding:0 12px; }
            .brand { font-size:0.95rem; letter-spacing:2px; }
            .map-search input { width:160px; }
            .view-toggle { right:8px; top:70px; }
            .view-toggle button { padding:6px 12px; font-size:0.75rem; }
            .terrain-panel { right:8px; bottom:8px; min-width:140px; padding:10px; }
            .compass { right:8px; top:120px; width:42px; height:42px; }
        }
    </style>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }

</head>
<body>
    <div class="top-bar">
        <div class="inner">
            <a href="/" class="brand">阴山文明走廊</a>
            <ul class="top-nav">
                <li><a href="/">首页</a></li>
                <li><a href="/culture">文化底蕴</a></li>
                <li><a href="/folk">民俗文化</a></li>
                <li><a href="/map" class="active">互动地图</a></li>
            </ul>
        </div>
    </div>

    <div class="view-container">
        <div class="view-panel is-active" id="mapPanel">
            <div class="map-view">
                <div id="amapContainer"></div>
                <div class="map-search">
                    <input type="text" placeholder="搜索遗址、地点..." id="mapSearchInput">

        </div>

        <div class="terrain-panel terrain-hud" id="terrainControls" style="display:none;">
            <div class="ptitle">导览控制</div>

            <div style="margin-top:8px;">

    <div id="siteModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h3 id="modalTitle"></h3>
            <img id="modalImage" src="" alt="">
            <p id="modalDesc"></p>
            <button id="exploreBtn">🏛️ 进入虚拟导览（360°全景）</button>

        <div class="close-panorama" id="closePanoramaBtn">✕</div>

    <!-- ============ 3D地形模块 (type=module) ============ -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let initialized = false;
        let scene, camera, renderer, labelRenderer, controls;
        let terrainMesh, cloudPts, sunGlow;
        let animId = null;
        let panoActive = false;
        let panoRenderer, panoScene, panoCamera, panoSphere;
        let isDragging = false, lMX = 0, lMY = 0, panRot = { yaw: 0, pitch: 0 };

        const siteData = [
            { name: '🏔️ 乌拉特中旗岩画群', x: -13, z: -7, desc: '阴山岩画最密集区域之一，分布大量狩猎、放牧、天体图案，距今千年以上。', img: '/static/assets/images/site3.jpg', pano: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg' },
            { name: '⛰️ 高阙塞遗址', x: 11, z: -6, desc: '赵武灵王修筑的阴山长城重要关隘，汉代卫青曾出塞于此。', img: '/static/assets/images/site6.jpg' },
            { name: '🏛️ 鸡鹿塞', x: 16, z: 8, desc: '汉代通往塞北的著名关塞，昭君出塞曾途经此地。', img: '/static/assets/images/site5.jpg' },
            { name: '🪨 阴山主峰', x: -5, z: -16, desc: '阴山山脉最高峰，海拔2364米，山势险峻，山顶常有云雾缭绕。', img: '/static/assets/images/site2.jpg' },
            { name: '📜 赵长城遗址', x: 6, z: 13, desc: '战国赵武灵王沿阴山修筑的早期长城。', img: '/static/assets/images/site4.jpg' },
            { name: '🐫 草原丝路', x: -9, z: 15, desc: '北魏至元代草原丝绸之路的重要通道，连接漠北与中原。', img: '/static/assets/images/site1.jpg' }
        ];

        function genTerrain(hs) {
            const w = 65, d = 55, s = 140;
            const g = new THREE.PlaneGeometry(w, d, s, s); g.rotateX(-Math.PI / 2);
            const p = g.attributes.position.array;
            for (let i = 0; i < p.length; i += 3) {
                let x = p[i], z = p[i + 2], y = 0;
                y += Math.sin(x * 0.22) * 1.5 + Math.sin(x * 0.7 + 1.5) * 0.8 + Math.cos(z * 0.45) * 0.9 + Math.sin((x * 0.55 + z * 0.5) * 1.3) * 1.0 + Math.sin(x * 2) * 0.25 + Math.cos(z * 1.8) * 0.25 + Math.exp(-((x + 5) ** 2 + (z + 2) ** 2) / 150) * 1.2 + Math.exp(-((x - 8) ** 2 + (z - 6) ** 2) / 200) * 1.0;
                const ex = 1 - Math.abs(x) / (w / 2) * 0.5, ez = 1 - Math.abs(z) / (d / 2) * 0.5;
                y = y * Math.min(ex, ez); y = Math.max(0.4, y + 0.8) * hs; p[i + 1] = y;
            }
            g.computeVertexNormals();
            const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#1e1810'; ctx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 3000; i++) { ctx.fillStyle = `rgba(50,38,22,${Math.random() * 0.35})`; ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2); }
            for (let i = 0; i < 1200; i++) { ctx.fillStyle = `rgba(80,55,30,${Math.random() * 0.45})`; ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 3, 3); }
            const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6);
            return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: t, roughness: 0.75, metalness: 0.12, color: 0x887766 }));
        }

        let labels = [];

        function addLabels() {
            labels.forEach(l => scene.remove(l));
            labels = [];
            siteData.forEach(s => {
                const d = document.createElement('div');
                d.textContent = s.name;
                d.style.cssText = 'color:#e7c98d;font-size:15px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.8);background:rgba(8,12,16,0.88);padding:7px 14px;border-radius:30px;border:1px solid rgba(201,169,110,0.3);font-family:"STKaiti","KaiTi",Georgia,serif;backdrop-filter:blur(8px);white-space:nowrap;cursor:pointer;letter-spacing:1px;transition:transform 0.2s,background 0.2s;';
                d.addEventListener('mouseenter', () => { d.style.transform = 'scale(1.06)'; d.style.background = 'rgba(16,22,28,0.92)'; });
                d.addEventListener('mouseleave', () => { d.style.transform = 'scale(1)'; d.style.background = 'rgba(8,12,16,0.88)'; });
                d.addEventListener('click', () => {
                    window.__openSiteModal(s.name, s.desc, s.img, s.pano);
                });
                const l = new CSS2DObject(d);
                let y = 0, md = 100;
                const tp = terrainMesh.geometry.attributes.position.array;
                for (let i = 0; i < tp.length; i += 3) {
                    const dist = Math.hypot(s.x - tp[i], s.z - tp[i + 2]);
                    if (dist < md) { md = dist; y = tp[i + 1]; }
                }
                l.position.set(s.x, y + 1.8, s.z);
                labels.push(l);
                scene.add(l);
            });
        }

        function initPano(url) {
            const pc = document.getElementById('panoramaViewer');
            if (panoRenderer) {
                new THREE.TextureLoader().load(url, tex => { panoSphere.material.map = tex; panoSphere.material.needsUpdate = true; });
                pc.style.display = 'block'; panoActive = true; panRot = { yaw: 0, pitch: 0 }; return;
            }
            panoScene = new THREE.Scene();
            panoCamera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
            panoCamera.position.set(0, 0, 0);
            panoSphere = new THREE.Mesh(new THREE.SphereGeometry(500, 64, 64), new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load(url), side: THREE.BackSide }));
            panoScene.add(panoSphere);
            panoRenderer = new THREE.WebGLRenderer({ antialias: true });
            panoRenderer.setSize(innerWidth, innerHeight);
            pc.appendChild(panoRenderer.domElement);

            panoRenderer.domElement.addEventListener('mousedown', e => { isDragging = true; lMX = e.clientX; lMY = e.clientY; panoRenderer.domElement.style.cursor = 'grabbing'; });
            window.addEventListener('mousemove', e => { if (!isDragging || !panoActive) return; panRot.yaw += (e.clientX - lMX) * 0.004; panRot.pitch += (e.clientY - lMY) * 0.004; panRot.pitch = Math.max(-1.4, Math.min(1.4, panRot.pitch)); panoCamera.quaternion.setFromEuler(new THREE.Euler(panRot.pitch, panRot.yaw, 0, 'YXZ')); lMX = e.clientX; lMY = e.clientY; });
            window.addEventListener('mouseup', () => { isDragging = false; if (panoRenderer) panoRenderer.domElement.style.cursor = 'grab'; });
            panoRenderer.domElement.addEventListener('touchstart', e => { if (e.touches.length === 1) { isDragging = true; lMX = e.touches[0].clientX; lMY = e.touches[0].clientY; } });
            window.addEventListener('touchmove', e => { if (!isDragging || !panoActive) return; panRot.yaw += (e.touches[0].clientX - lMX) * 0.004; panRot.pitch += (e.touches[0].clientY - lMY) * 0.004; panRot.pitch = Math.max(-1.4, Math.min(1.4, panRot.pitch)); panoCamera.quaternion.setFromEuler(new THREE.Euler(panRot.pitch, panRot.yaw, 0, 'YXZ')); lMX = e.touches[0].clientX; lMY = e.touches[0].clientY; });
            window.addEventListener('touchend', () => { isDragging = false; });

            function anim() { if (!panoActive) return; requestAnimationFrame(anim); panoRenderer.render(panoScene, panoCamera); }
            anim();
            pc.style.display = 'block'; panoActive = true; panoRenderer.domElement.style.cursor = 'grab';
        }

        function animate() {
            animId = requestAnimationFrame(animate);
            const panel = document.getElementById('terrainPanel');
            if (!panel || !panel.classList.contains('is-active')) return;
            if (cloudPts) cloudPts.rotation.y += 0.0005;
            if (sunGlow) sunGlow.position.x = 15 + Math.sin(performance.now() * 0.0003) * 2;
            const dir = camera.getWorldDirection(new THREE.Vector3());
            const angle = Math.atan2(dir.x, dir.z) * 180 / Math.PI;
            const cm = document.getElementById('compass'), ca = document.getElementById('compassArrow');
            if (cm && ca) {
                ca.style.transform = `rotate(${angle}deg)`;
                ca.style.transformOrigin = 'center bottom';
            }
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // 暴露给全局的初始化函数
        window.__initTerrain = function () {
            if (initialized) return;
            initialized = true;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060d14);
            scene.fog = new THREE.FogExp2(0x060d14, 0.0005);

            camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
            camera.position.set(22, 16, 32); camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            document.getElementById('terrainPanel').appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(innerWidth, innerHeight);
            labelRenderer.domElement.style.cssText = 'position:absolute;top:0;pointer-events:auto;';
            document.getElementById('terrainPanel').appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.06;
            controls.rotateSpeed = 0.8; controls.zoomSpeed = 1.0; controls.target.set(0, 2, 0);

            terrainMesh = genTerrain(1.2); scene.add(terrainMesh);

            const grid = new THREE.GridHelper(100, 20, 0x665544, 0x33281a);
            grid.position.y = -0.8; grid.material.transparent = true; grid.material.opacity = 0.15; scene.add(grid);

            // 星星：少量精致光点
            const stars = []; for (let i = 0; i < 200; i++) stars.push((Math.random() - 0.5) * 500, Math.random() * 100 + 30, (Math.random() - 0.5) * 280 - 80);
            const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(stars), 3));
            const starMat = new THREE.PointsMaterial({ color: 0xd4c8a0, size: 0.3, opacity: 0.55, transparent: true });
            scene.add(new THREE.Points(sg, starMat));

            // 大气薄雾粒子
            const cpos = []; for (let i = 0; i < 120; i++) cpos.push((Math.random() - 0.5) * 100, Math.random() * 10 + 8, (Math.random() - 0.5) * 60);
            const cg = new THREE.BufferGeometry(); cg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cpos), 3));
            cloudPts = new THREE.Points(cg, new THREE.PointsMaterial({ color: 0xccbba0, size: 0.55, opacity: 0.18, transparent: true })); scene.add(cloudPts);

            // 地面植被微点
            const ga = []; const tp = terrainMesh.geometry.attributes.position.array;
            for (let i = 0; i < 800; i++) {
                const x = (Math.random() - 0.5) * 58, z = (Math.random() - 0.5) * 48; let y = 0, md = 100;
                for (let j = 0; j < tp.length; j += 3) { const d = Math.hypot(x - tp[j], z - tp[j + 2]); if (d < md) { md = d; y = tp[j + 1]; } }
                if (y < 1) continue; ga.push(x, y + 0.08, z);
            }
            const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ga), 3));
            scene.add(new THREE.Points(gg, new THREE.PointsMaterial({ color: 0x7a9060, size: 0.1, opacity: 0.55, transparent: true })));

            scene.add(new THREE.AmbientLight(0x282c36));
            const ml = new THREE.DirectionalLight(0xd8c8a8, 0.9); ml.position.set(12, 22, 8); scene.add(ml);
            const fl = new THREE.PointLight(0x887766, 0.35); fl.position.set(-5, 8, -10); scene.add(fl);
            const bl = new THREE.PointLight(0x556677, 0.3); bl.position.set(0, 12, -15); scene.add(bl);
            sunGlow = new THREE.PointLight(0xbb8855, 0.6); sunGlow.position.set(15, 25, -10); scene.add(sunGlow);

            addLabels();

            document.getElementById('autoRotateBtn').addEventListener('click', () => {
                if (!controls._auto) controls._auto = false;
                controls._auto = !controls._auto;
                controls.autoRotate = controls._auto;
                controls.autoRotateSpeed = 1.2;
                document.getElementById('autoRotateBtn').textContent = controls._auto ? '自动旋转 (开)' : '自动旋转 (关)';
            });
            document.getElementById('resetViewBtn').addEventListener('click', () => {
                camera.position.set(22, 16, 32); controls.target.set(0, 2, 0); controls.update();
            });
            document.getElementById('heightScale').addEventListener('input', e => {
                const hs = parseFloat(e.target.value);
                scene.remove(terrainMesh); terrainMesh = genTerrain(hs); scene.add(terrainMesh);
                addLabels();
            });

            animate();

            window.addEventListener('resize', () => {
                if (!camera || !renderer) return;
                camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
                if (labelRenderer) labelRenderer.setSize(innerWidth, innerHeight);
            });

            // 全景按钮
            document.getElementById('exploreBtn').addEventListener('click', () => {
                const u = document.getElementById('exploreBtn').getAttribute('data-pano');
                if (u) { initPano(u); document.getElementById('siteModal').style.display = 'none'; }
            });
            document.getElementById('closePanoramaBtn').addEventListener('click', () => {
                document.getElementById('panoramaViewer').style.display = 'none'; panoActive = false; isDragging = false;
            });
        };
    </script>

    <!-- ============ 地图 + 切换逻辑（常规脚本） ============ -->
    <script>
    // 共享弹窗函数
    window.__openSiteModal = function (name, desc, img, pano) {
        document.getElementById('modalTitle').textContent = name;
        document.getElementById('modalDesc').textContent = desc;
        document.getElementById('modalImage').src = img || '';
        const eb = document.getElementById('exploreBtn');
        if (pano) { eb.style.display = 'block'; eb.setAttribute('data-pano', pano); } else { eb.style.display = 'none'; }
        document.getElementById('siteModal').style.display = 'flex';
    };
    document.getElementById('closeModalBtn').onclick = () => document.getElementById('siteModal').style.display = 'none';
    window.onclick = e => { if (e.target === document.getElementById('siteModal')) document.getElementById('siteModal').style.display = 'none'; };

    // 地图
    let amap = null, amapInit = false;
    const pois = [
        { name: '🏔️ 乌拉特中旗岩画群', lng: 108.6, lat: 41.6, desc: '阴山岩画最密集区域之一，分布大量狩猎、放牧、天体图案。' },
        { name: '⛰️ 高阙塞遗址', lng: 107.1, lat: 41.4, desc: '赵武灵王修筑的阴山长城重要关隘，汉代卫青曾出塞于此。' },
        { name: '🏛️ 鸡鹿塞', lng: 106.9, lat: 40.9, desc: '汉代通往塞北的著名关塞，昭君出塞曾途经此地。' },
        { name: '🪨 阴山岩画（格尔敖包沟）', lng: 107.5, lat: 41.2, desc: '保存完好的岩画点，有群鹿图、猎手与弓等。' },
        { name: '📜 赵长城遗迹', lng: 110.2, lat: 40.8, desc: '战国赵武灵王沿阴山修筑的早期长城。' },
        { name: '🐫 草原丝路古道', lng: 108.9, lat: 41.0, desc: '北魏至元代草原丝绸之路的重要通道，连接漠北与中原。' },
        { name: '🏯 沃野镇遗址', lng: 109.5, lat: 40.9, desc: '北魏六镇之一，边防重镇，见证了民族融合。' }
    ];
    function initAmap() {
        if (amapInit) return;
        amap = new AMap.Map('amapContainer', { zoom: 8, center: [108.5, 41.2], viewMode: '3D', pitch: 38, mapStyle: 'amap://styles/dark' });
        const iw = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -30), autoMove: true });
        pois.forEach(p => {
            const m = new AMap.Marker({
                position: [p.lng, p.lat], title: p.name,
                icon: new AMap.Icon({ size: new AMap.Size(28, 36), image: 'https://a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-red.png', imageSize: new AMap.Size(28, 36) }),
                offset: new AMap.Pixel(-14, -36)
            });
            m.setMap(amap);
            m.on('click', () => {
                iw.setContent('<div style="font-family:\'Microsoft YaHei\',sans-serif;max-width:280px;background:rgba(14,18,20,0.96);border:1px solid rgba(201,169,110,0.3);border-left:3px solid #c9a96e;padding:10px 14px;border-radius:6px;color:#f7f0df;"><h4 style="margin:0 0 6px;color:#e7c98d;font-size:15px;">' + p.name + '</h4><p style="margin:0;font-size:13px;color:#b7aa93;line-height:1.5;">' + p.desc + '</p><small style="color:rgba(201,169,110,0.6);">📍 阴山文化遗产</small></div>');
                iw.open(amap, [p.lng, p.lat]);
            });
        });
        new AMap.Polygon({ path: [[105.5, 42], [112, 42], [113, 40.5], [106, 40], [105.5, 42]], strokeColor: '#c9a96e', strokeWeight: 2, fillColor: '#c9a96e', fillOpacity: 0.08, strokeStyle: 'dashed' }).setMap(amap);
        AMap.plugin(['AMap.ToolBar', 'AMap.Scale'], () => { amap.addControl(new AMap.ToolBar({ position: 'RT' })); amap.addControl(new AMap.Scale({ position: 'LB' })); });
        document.getElementById('mapSearchBtn').addEventListener('click', () => {
            const kw = document.getElementById('mapSearchInput').value.trim(); if (!kw) return;
            AMap.plugin(['AMap.PlaceSearch'], () => { new AMap.PlaceSearch({ map: amap, pageSize: 1 }).search(kw, (s, r) => { if (s === 'complete' && r.poiList.pois.length) { const po = r.poiList.pois[0]; amap.setCenter([po.location.lng, po.location.lat]); new AMap.Marker({ position: [po.location.lng, po.location.lat], map: amap }); } }); });
        });
        document.getElementById('mapSearchInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('mapSearchBtn').click(); });
        amapInit = true;
    }

    // 视图切换
    const mapPanel = document.getElementById('mapPanel'), terrainPanel = document.getElementById('terrainPanel');
    const btnMap = document.getElementById('btnMap'), btnTerrain = document.getElementById('btnTerrain');
    const terrainControls = document.getElementById('terrainControls'), compass = document.getElementById('compass');
    let currentView = 'map';

    function switchView(view) {
        if (currentView === view) return;
        currentView = view;
        if (view === 'map') {
            btnMap.classList.add('is-active'); btnTerrain.classList.remove('is-active');
            mapPanel.classList.add('is-active'); terrainPanel.classList.remove('is-active');
            terrainControls.style.display = 'none'; compass.style.display = 'none';
            initAmap();
        } else {
            btnTerrain.classList.add('is-active'); btnMap.classList.remove('is-active');
            terrainPanel.classList.add('is-active'); mapPanel.classList.remove('is-active');
            terrainControls.style.display = 'block'; compass.style.display = 'flex';
            if (window.__initTerrain) window.__initTerrain();
        }
    }
    btnMap.addEventListener('click', () => switchView('map'));
    btnTerrain.addEventListener('click', () => switchView('terrain'));
    initAmap();
    </script>
</body>
